<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600">
  <defs>
    <clipPath id="eyeClip">
      <path d="M 50,300 A 524.56 524.56 0 0,1 950,300 A 524.56 524.56 0 0,1 50,300 Z" />
    </clipPath>
  </defs>
  
  <!-- Group clipped to the inner eye shape -->
  <g clip-path="url(#eyeClip)">
    <!-- Pure White Background (The 4 White Keys) -->
    <rect x="0" y="0" width="1000" height="600" fill="#FFFFFF" />
    
    <!-- 3 Vertical Divider Lines (Between White Keys) -->
    <line x1="310" y1="340" x2="310" y2="600" stroke="#000000" stroke-width="14" stroke-linecap="square" />
    <line x1="500" y1="340" x2="500" y2="600" stroke="#000000" stroke-width="14" stroke-linecap="square" />
    <line x1="690" y1="340" x2="690" y2="600" stroke="#000000" stroke-width="14" stroke-linecap="square" />
    
    <!-- 3 Black Piano Keys -->
    <rect x="271" y="0" width="78" height="348" rx="10" ry="10" fill="#000000" />
    <rect x="461" y="0" width="78" height="348" rx="10" ry="10" fill="#000000" />
    <rect x="651" y="0" width="78" height="348" rx="10" ry="10" fill="#000000" />
  </g>
  
  <!-- Uniform Symmetrical Outer Black Border -->
  <path d="M 50,300 A 524.56 524.56 0 0,1 950,300 A 524.56 524.56 0 0,1 50,300 Z" 
        fill="none" 
        stroke="#000000" 
        stroke-width="36" 
        stroke-linejoin="miter"
        stroke-miterlimit="4" />
</svg>